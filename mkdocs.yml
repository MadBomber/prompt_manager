# MkDocs Configuration for PM (PromptManager) Documentation
site_name: PM (PromptManager)
site_description: Parse YAML metadata from markdown prompts with shell expansion and ERB rendering
site_author: Dewayne VanHoozer
site_url: https://madbomber.github.io/prompt_manager
copyright: Copyright &copy; 2025 Dewayne VanHoozer

# Repository information
repo_name: madbomber/prompt_manager
repo_url: https://github.com/madbomber/prompt_manager
edit_uri: edit/main/docs/

# Configuration
theme:
  name: material

  # Color scheme
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Typography
  font:
    text: Roboto
    code: Roboto Mono

  # Logo and icon
  icon:
    repo: fontawesome/brands/github
    logo: material/text-box-outline

  # Theme features
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page

  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: madbomber
      repo: prompt_manager
      normalize_issue_symbols: true
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra CSS
extra_css:
  - assets/css/custom.css

# Social media and extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/madbomber/prompt_manager
      name: PM on GitHub
    - icon: fontawesome/solid/gem
      link: https://rubygems.org/gems/prompt_manager
      name: PM on RubyGems

  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: Thanks for your feedback! Help us improve by creating an issue.

# Navigation
nav:
  - Home:
      - Overview: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Configuration: getting-started/configuration.md
  - Guides:
      - guides/index.md
      - Parsing Prompts: guides/parsing.md
      - Parameters: guides/parameters.md
      - Shell Expansion: guides/shell-expansion.md
      - ERB Rendering: guides/erb-rendering.md
      - Including Files: guides/includes.md
      - Custom Directives: guides/custom-directives.md
      - Comment Stripping: guides/comment-stripping.md
  - API Reference:
      - api/index.md
      - PM Module: api/pm-module.md
      - Configuration: api/configuration.md
      - Metadata: api/metadata.md
      - Parsed: api/parsed.md
      - RenderContext: api/render-context.md
      - Constants: api/constants.md
  - Architecture:
      - architecture/index.md
      - Processing Pipeline: architecture/processing-pipeline.md
      - Design Decisions: architecture/design-decisions.md
  - Examples:
      - examples/index.md
      - Code Review Prompt: examples/code-review-prompt.md
      - Multi-File Composition: examples/multi-file-composition.md
      - AI Agent Prompts: examples/ai-agent-prompts.md
