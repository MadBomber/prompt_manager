name: Test
on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

# A newer push to a PR cancels its older run; each push to main/develop has
# its own group (head_ref is empty there), so every commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The gemspec floor is 4.0.9; '4.0' resolves to the newest 4.0.x.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # rake test sets COVERAGE=1, which arms the 100% line coverage gate.
      - name: Run tests
        run: bundle exec rake test
